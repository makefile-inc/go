name: 'Test go code'
description: | 
  Test go code with https://github.com/makefile-inc/go
  This action does not build any binaries. If you need check build binary
  before or after testing use your own steps. 
  By default, action will checkout repo on github.event.pull_request.head.sha
  if handle `PullRequestEvent` with `submodules: "recursive"` option.
inputs:
  go_version:
    description: |
      Go version for actions/setup-go like `1.26.x`.
      If do not need to setup go pass empty string.
    required: false
    default: '1.26.x'
  checkout:
    description: |
      Checkout repo. 
      You can pass next values:
      - '_pull_request_ref_' - will checkout on `github.event.pull_request.head.sha` if handle `PullRequestEvent` 
        with `submodules: "recursive"` option.
        If event is not `PullRequestEvent` or `github.event.pull_request.head.sha` is empty, will exit with error
      - '' - empty string disable, pass for example run tests on tags.
        In this case you need checkout manually before run action
        with `submodules: "recursive"` option!
        It is default, because we suppose that you are using action with submodule.
      - 'ref' - non-empty string represents as ref in github repo.
        Will checkout with `submodules: "recursive"` option.
    required: false
    default: ''
  check_gitignore:
    description: |
      Check .gitignore for repo for in sync with makefile include repo.
      Pass 'false' to disable.
    required: false
    default: 'true'
  run_race_tests:
    description: |
      Run tests with `-race` flag
      Values:
      - no - no run race tests (default)
      - with_tests - run race tests after run tests without `-race`
      - without_tests - run race tests without no race tests
    required: false
    default: 'no'
  parallel_tests:
    description: |
      Run tests in parallel (by default).
      Pass 'false' to run tests with flag `-p 1`
    required: false
    default: 'true'
  tests_envs:
    description: |
      Add envs to run tests.
      Should be in `.env` format like: 
        # disable e2e
        ENABLE_E2E=false
        # enable integration 
        ENABLE_INTEGRATION=true
    required: false
    default: ''
  tests_tags:
    description: |
      Comma-separated tags for run tests.
    required: false
    default: ''
runs:
  using: 'composite'
  steps:
  - name: Checkout ref resolve
    id: "checkout_resolve"
    env:
      ref_from_user: ${{ inputs.checkout }}
      ref_from_pull: ${{ (github.event.type == 'PullRequestEvent' && github.event.pull_request) && github.event.pull_request.head.sha || '' }}
    shell: bash
    run: |
      ref_to_output="$ref_from_user"
      if [ -n "$ref_to_output" ]; then
        if [[ "$ref_to_output" == "_pull_request_ref_" ]]; then
          if [ -z "$ref_from_pull" ]; then
            echo -e "\033[0;31mPassed use ref from pull request but pull request ref is empty\033[0m"
            exit 1
          fi
          ref_to_output="$ref_from_pull"
        fi
      fi
      echo "Checkout ref is '$ref_to_output'"
      echo "ref=$ref_to_output" >> "$GITHUB_OUTPUT"

  - name: Checkout
    if: ${{ steps.checkout_resolve.outputs.ref != '' }}
    uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
    with:
      fetch-depth: 0
      submodules: "recursive"
      ref: ${{ steps.checkout_resolve.outputs.ref }}

  - name: Setup Go
    if: ${{ inputs.go_version != '' }}
    uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
    with:
      go-version: ${{ inputs.go_version }}

  - name: Check .gitignore
    if: ${{ inputs.check_gitignore == 'true' }}
    shell: bash
    run: make go/check/gitignore

  - name: Check go mod tidy not produce diff
    shell: bash
    run: make go/check/no-tidy

  - name: Write envs file
    if: ${{ inputs.tests_envs != '' }}
    shell: bash
    run: |
      echo '${{ inputs.tests_envs }}' > .tests_dot_env

  - name: Run tests without race
    if: ${{ inputs.run_race_tests != 'without_tests' }}
    shell: bash
    env:
      GO_TEST_PARALLEL: ${{ inputs.parallel_tests == 'true' && '' || '1' }}
      GO_TEST_TAGS: ${{ inputs.tests_tags }}
    run: |
      if [ -f ".tests_dot_env" ]; then
        set -a && source .tests_dot_env && set +a
      fi
      make go/test

  - name: Run tests with race
    if: ${{ inputs.run_race_tests != 'no' }}
    shell: bash
    env:
      GO_TEST_PARALLEL: ${{ inputs.parallel_tests == 'true' && '' || '1' }}
      GO_TEST_TAGS: ${{ inputs.tests_tags }}
    run: |
      if [ -f ".tests_dot_env" ]; then
        set -a && source .tests_dot_env && set +a
      fi
      make go/test/race

  - name: Lint code
    shell: bash
    run: make go/lint

  - name: Cleanup
    if: always()
    shell: bash
    run: |
      rm -f ".tests_dot_env"
