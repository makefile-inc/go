name: 'Test go code'
description: | 
  Test go code with https://github.com/makefile-inc/go
  This action does not build any binaries. If you need check build binary
  before or after testing use your own steps. 
  By default, action will checkout repo on github.event.pull_request.head.sha
  if handle `PullRequestEvent` with `submodules: "recursive"` option.
inputs:
  go_version:
    description: |
      Go version for actions/setup-go like `1.26.x`.
      If do not need to setup go pass empty string.
    required: false
    default: '1.26.x'
  checkout:
    description: |
      Checkout repo. 
      You can pass next values:
      - '_pull_request_ref_' - will checkout on `github.event.pull_request.head.sha` if handle `PullRequestEvent` 
        with `submodules: "recursive"` option.
        If event is not `PullRequestEvent` or `github.event.pull_request.head.sha` is empty, will exit with error
      - '' - empty string disable, pass, for example, to run on tags.
        In this case you need checkout manually before run action
        with `submodules: "recursive"` option!
        It is default, because we suppose that you are using action with submodule.
      - 'ref' - non-empty string represents as ref in github repo.
        Will checkout with `submodules: "recursive"` option.
    required: false
    default: ''
  check_gitignore:
    description: |
      Check .gitignore for repo for in sync with makefile include repo.
      Pass 'false' to disable.
    required: false
    default: 'true'
  run_race_tests:
    description: |
      Run tests with `-race` flag
      Values:
      - no - no run race tests (default)
      - with_tests - run race tests after run tests without `-race`
      - without_tests - run race tests without no race tests
    required: false
    default: 'no'
  tests_parallelism:
    description: |
      Use `go test` default parallelism mechanics (by default).
      Pass 'false' to run tests with flag `-p 1`
    required: false
    default: 'true'
  tests_envs:
    description: |
      Add envs to run tests.
      Should be in `.env` format like: 
        # disable e2e
        ENABLE_E2E=false
        # enable integration 
        ENABLE_INTEGRATION=true
    required: false
    default: ''
  tests_tags:
    description: |
      Comma-separated tags for run tests.
    required: false
    default: ''
  parallel:
    description: |
      Run tasks in parallel with bash.
      Uses utils functions from
        https://gist.github.com/name212/713d715b94a627c2ef41c0425c4ae05b
      for task runnings.
      Values:
      - 'tests' - run race tests and non-race tests in parallel
      - 'lint' - run gitignore check and lint go-code in parallel
      - 'all' - tests and lint (it is default)
      - '' - empty string run all sequentially
    required: false
    default: 'all'
runs:
  using: 'composite'
  steps:
  - name: Checkout ref resolve
    id: "checkout_resolve"
    env:
      ref_from_user: ${{ inputs.checkout }}
      ref_from_pull: ${{ (github.event.type == 'PullRequestEvent' && github.event.pull_request) && github.event.pull_request.head.sha || '' }}
    shell: bash
    run: |
      # Resolve checkout ref

      ref_to_output="$ref_from_user"
      if [ -n "$ref_to_output" ]; then
        if [[ "$ref_to_output" == "_pull_request_ref_" ]]; then
          if [ -z "$ref_from_pull" ]; then
            echo -e "\033[0;31mPassed use ref from pull request but pull request ref is empty\033[0m"
            exit 1
          fi
          ref_to_output="$ref_from_pull"
        fi
      fi
      echo "Checkout ref is '$ref_to_output'"
      echo "ref=$ref_to_output" >> "$GITHUB_OUTPUT"

  - name: Checkout
    if: ${{ steps.checkout_resolve.outputs.ref != '' }}
    uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    with:
      fetch-depth: 0
      submodules: "recursive"
      ref: ${{ steps.checkout_resolve.outputs.ref }}

  - name: Setup Go
    if: ${{ inputs.go_version != '' }}
    uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
    with:
      go-version: ${{ inputs.go_version }}

  - name: Check go mod tidy not produce diff
    shell: bash
    run: |
      # Check go mod tidy not produce diff

      make go/check/no-tidy

  - name: Write test envs to file
    id: test_envs
    if: ${{ inputs.tests_envs != '' }}
    shell: bash
    run: |
      # Write tests envs to file

      envs_file="$(realpath .)"
      envs_file="${envs_file}/.tests_dot_env_$RANDOM"

      echo '${{ inputs.tests_envs }}' > "$envs_file"
      echo "path=${envs_file}" >> "$GITHUB_OUTPUT"
      echo "CLEANUP_PATH_TEST_ENVS=$envs_file" >> "$GITHUB_ENV"

  - name: Run tests
    shell: bash
    env:
      GO_TEST_PARALLEL: ${{ inputs.tests_parallelism == 'true' && '' || '1' }}
      GO_TEST_TAGS: ${{ inputs.tests_tags }}
      RUN_IN_PARALLEL: ${{ (inputs.parallel == 'all' || inputs.parallel == 'tests') && 'true' || '' }}
      ENVS_FILE: ${{ steps.test_envs.outputs.path }}
      RUN_NO_RACE: ${{ inputs.run_race_tests != 'without_tests' && 'true' || '' }}
      RUN_WITH_RACE: ${{ inputs.run_race_tests != 'no' && 'true' || '' }}
      TMPDIR: ${{ runner.temp }}
    run: |
      # Run tests

      source ${{ github.action_path }}/parallel.inc.sh

      function do_tests() {
        make go/test
        return $?
      }

      function do_with_race() {
        make go/test/race
        return $?
      }

      tasks=()

      if [[ "${RUN_NO_RACE:-}" == "true" ]]; then
        tasks+=("do_tests")
      fi

      if [[ "${RUN_WITH_RACE:-}" == "true" ]]; then
        echo "Race tests enabled"
        tasks+=("do_with_race")
      fi

      if [ "${#tasks[@]}" -eq 0 ]; then
        echo "Got empty tasks for run"
        exit 1
      fi

      declare -A _tasks_to_msg
      _tasks_to_msg["do_tests"]="Run tests"
      _tasks_to_msg["do_with_race"]="Run tests with race"

      if [ -n "$ENVS_FILE" ]; then
        if [ -f "$ENVS_FILE" ]; then
          set -a && source "$ENVS_FILE" && set +a
        fi
      fi

      # install deps not in parallel for prevent File busy error
      make go/test/deps

      _run_tasks_and_exit "${tasks[@]}"

  - name: Lint
    shell: bash
    env:
      RUN_GIT_IGNORE: ${{ inputs.check_gitignore == 'true' && 'true' || '' }}
      RUN_IN_PARALLEL: ${{ (inputs.parallel == 'all' || inputs.parallel == 'lint') && 'true' || '' }}
      TMPDIR: ${{ runner.temp }}
    run: |
      # Lint

      source ${{ github.action_path }}/parallel.inc.sh

      function do_lint() {
        make go/lint
        return $?
      }

      function do_gitignore() {
        make go/check/gitignore
        return $?
      }

      tasks=("do_lint")

      if [[ "${RUN_GIT_IGNORE:-}" == "true" ]]; then
        tasks+=("do_gitignore")
      fi


      declare -A _tasks_to_msg
      _tasks_to_msg["do_gitignore"]="Check .gitignore"
      _tasks_to_msg["do_lint"]="Lint go code"
      
      _run_tasks_and_exit "${tasks[@]}"

  - name: Cleanup
    if: always()
    uses: name212/action-cleanup@377b123439a8ed3ada3d9553857d2a0a7bc3fcf9 # v2
